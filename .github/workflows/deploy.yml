name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Needed so the job can publish to the Pages environment.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the portfolio code
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Prerenders "/" into a static index.html (see vite.config.ts).
      - name: Build the static site
        run: bun run build

      # The static output lands in dist/client or .output/public depending on
      # the build toolchain version — normalize it into ./site either way.
      # GitHub Pages answers unknown URLs with 404.html — point it at the
      # portfolio so any link lands on the site instead of an error page.
      - name: Prepare the site for Pages
        run: |
          if [ -d dist/client ]; then cp -r dist/client site; else cp -r .output/public site; fi
          cp site/index.html site/404.html

      - name: Upload the built site to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
